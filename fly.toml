# fly.toml app configuration file generated for hack-week-vote on 2026-05-12T16:59:01+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hack-week-vote'
primary_region = 'lhr'

[build]

[env]
  DATABASE_PATH = '/data/votes.db'

[[mounts]]
  source = 'votes_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
